name: Daily Flight Deals Update

on:
  schedule:
    # 每天台灣時間早上 8:00 自動執行 (即 UTC 00:00)
    - cron: '0 0 * * *'
  # 允許您隨時在 GitHub 網頁上點擊按鈕手動觸發執行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run flight tracker script
        run: python update_deals.py

      - name: Commit and push generated HTML
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git commit -m "Auto update daily flight deals [skip ci]" || exit 0
          git push
